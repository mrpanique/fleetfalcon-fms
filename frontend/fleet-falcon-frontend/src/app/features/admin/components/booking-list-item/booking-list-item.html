<li class="booking-item">
  <a
    [routerLink]="item.detailsRoute"
    class="booking-item-link"
    [class.pending-link]="item.highlightPending"
    [attr.aria-label]="item.ariaLabel"
  >
    <div>
      <p class="booking-employee">{{ item.employeeName }} ({{ item.employeeId }})</p>
      <p class="booking-vehicle">{{ item.vehicleName }}</p>
      <p class="booking-date">{{ item.dateRange }}</p>
    </div>
    <app-status-indicator [status]="item.status" />
  </a>
</li>
