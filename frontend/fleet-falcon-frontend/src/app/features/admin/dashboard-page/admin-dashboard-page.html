<section class="admin-dashboard-shell" aria-labelledby="admin-dashboard-title">
  <div class="admin-dashboard-wrap">
    <header class="admin-dashboard-header">
      <h1 id="admin-dashboard-title" class="admin-dashboard-title">Admin Dashboard</h1>
    </header>

    <!-- All Bookings Section -->
    <article class="admin-dashboard-card" aria-labelledby="pending-list-title">
      <h2 id="pending-list-title" class="card-title">All Bookings</h2>

      <app-admin-booking-list
        [items]="pendingBookings()"
        ariaLabel="All bookings"
        emptyMessage="No bookings at the moment"
      />
    </article>

    <!-- Admin's Upcoming Bookings Section -->
    <article class="admin-dashboard-card" aria-labelledby="my-bookings-list-title">
      <h2 id="my-bookings-list-title" class="card-title">My Upcoming Bookings</h2>

      <app-admin-booking-list
        [items]="adminBookings"
        ariaLabel="Your upcoming bookings"
        emptyMessage="No upcoming bookings scheduled"
      />
    </article>
  </div>
</section>
