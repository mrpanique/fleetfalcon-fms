<!-- This is essentially the register page. -->

<app-admin-form-layout
  headingId="employee-create-title"
  title="Add new employee"
  cardAriaLabel="Editable employee data"
>
      <form class="employee-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="employee.email" name="email" autocomplete="email" [attr.aria-invalid]="getEmailError() ? 'true' : null" />
          @if (getEmailError(); as emailError) {
            <p class="field-error" role="alert">{{ emailError }}</p>
          }
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" [(ngModel)]="employee.password" name="password" autocomplete="new-password" [attr.aria-invalid]="getPasswordError() ? 'true' : null" />
          @if (getPasswordError(); as passwordError) {
            <p class="field-error" role="alert">{{ passwordError }}</p>
          }
        </div>
        <div class="field"><label for="role">Role</label>
          <select id="role" [(ngModel)]="employee.role" name="role"><option value="EMPLOYEE">Employee</option><option value="ADMIN">Admin</option></select>
        </div>

        <div class="separator" aria-hidden="true"></div>

        <div class="field"><label for="firstName">First name</label><input id="firstName" type="text" [(ngModel)]="employee.firstName" name="firstName" /></div>
        <div class="field"><label for="lastName">Last name</label><input id="lastName" type="text" [(ngModel)]="employee.lastName" name="lastName" /></div>
        <div class="field"><label for="employeeId">Employee ID</label><input id="employeeId" type="text" [(ngModel)]="employee.employeeId" name="employeeId" /></div>
        <div class="field"><label for="department">Department</label><input id="department" type="text" [(ngModel)]="employee.department" name="department" /></div>
        <div class="field"><label for="phoneNumber">Phone number</label><input id="phoneNumber" type="text" [(ngModel)]="employee.phoneNumber" name="phoneNumber" /></div>
        <div class="field"><label for="drivingLicenseNumber">Driving license number</label><input id="drivingLicenseNumber" type="text" [(ngModel)]="employee.drivingLicenseNumber" name="drivingLicenseNumber" /></div>
      </form>

      <div class="actions-row">
        <a routerLink="/admin/employees" class="back-btn">Back</a>
        <button type="button" class="save-btn" (click)="saveEmployee()">Save</button>
      </div>
</app-admin-form-layout>
