<section class="vehicle-edit-shell" aria-labelledby="vehicle-create-title">
  <div class="vehicle-edit-wrap">
    <header class="vehicle-edit-header">
      <h1 id="vehicle-create-title" class="vehicle-edit-title">Add new vehicle</h1>
      <p class="vehicle-id">New vehicle form</p>
    </header>

    <article class="vehicle-card" aria-label="Editable vehicle data">
      <h2 class="vehicle-name">New vehicle</h2>

      <form class="vehicle-form" novalidate>
        <div class="field"><label for="brand">Brand</label><input id="brand" type="text" [(ngModel)]="vehicle.brand" name="brand" /></div>
        <div class="field"><label for="model">Model</label><input id="model" type="text" [(ngModel)]="vehicle.model" name="model" /></div>
        <div class="field"><label for="vehicleType">Vehicle type</label><input id="vehicleType" type="text" [(ngModel)]="vehicle.vehicleType" name="vehicleType" /></div>
        <div class="field"><label for="fuelType">Fuel type</label><input id="fuelType" type="text" [(ngModel)]="vehicle.fuelType" name="fuelType" /></div>
        <div class="field"><label for="releaseYear">Release year</label><input id="releaseYear" type="number" [(ngModel)]="vehicle.releaseYear" name="releaseYear" /></div>
        <div class="field"><label for="dailyPrice">Daily price (Ft)</label><input id="dailyPrice" type="number" [(ngModel)]="vehicle.dailyPrice" name="dailyPrice" /></div>
        <div class="field"><label for="seatingCapacity">Seating capacity</label><input id="seatingCapacity" type="number" [(ngModel)]="vehicle.seatingCapacity" name="seatingCapacity" /></div>
        <div class="field"><label for="licensePlate">License plate</label><input id="licensePlate" type="text" [(ngModel)]="vehicle.licensePlate" name="licensePlate" /></div>
        <div class="field"><label for="status">Current status</label><input id="status" type="text" [(ngModel)]="vehicle.status" name="status" /></div>
        <div class="field"><label for="currentMileage">Current mileage</label><input id="currentMileage" type="number" [(ngModel)]="vehicle.currentMileage" name="currentMileage" /></div>
        <div class="field"><label for="inspectionValidUntil">Inspection valid until</label><input id="inspectionValidUntil" type="date" [(ngModel)]="vehicle.inspectionValidUntil" name="inspectionValidUntil" /></div>
        <div class="field"><label for="nextServiceMileage">Next service mileage</label><input id="nextServiceMileage" type="number" [(ngModel)]="vehicle.nextServiceMileage" name="nextServiceMileage" /></div>
        <div class="field"><label for="nextServiceDate">Next service date</label><input id="nextServiceDate" type="date" [(ngModel)]="vehicle.nextServiceDate" name="nextServiceDate" /></div>

        <div class="field field-full">
          <label for="description">Description</label>
          <textarea id="description" rows="4" [(ngModel)]="vehicle.description" name="description"></textarea>
        </div>
      </form>

      <div class="actions-row">
        <a routerLink="/admin/vehicles" class="back-btn">Back</a>
        <button type="button" class="save-btn" (click)="saveVehicle()">Save</button>
      </div>
    </article>
  </div>
</section>
