<app-admin-form-layout
  headingId="record-create-title"
  title="Add new service record"
  cardAriaLabel="Editable service record data"
>
      <form class="record-form" novalidate>
        <div class="field"><label for="type">Service type</label><input id="type" type="text" [(ngModel)]="record.type" name="type" /></div>
        <div class="field"><label for="startDate">Start date</label><input id="startDate" type="date" [(ngModel)]="record.startDate" name="startDate" /></div>
        <div class="field"><label for="endDate">End date</label><input id="endDate" type="date" [(ngModel)]="record.endDate" name="endDate" /></div>
        <div class="field"><label for="cost">Cost ($)</label><input id="cost" type="number" step="0.01" [(ngModel)]="record.cost" name="cost" /></div>
        <div class="field"><label for="description">Description</label><textarea id="description" [(ngModel)]="record.description" name="description" rows="4"></textarea></div>
      </form>

      <div class="actions-row">
        <a [routerLink]="['/admin/vehicles', vehicleId(), 'service-log']" class="back-btn">Back</a>
        <button type="button" class="save-btn" (click)="saveRecord()">Save</button>
      </div>
</app-admin-form-layout>
