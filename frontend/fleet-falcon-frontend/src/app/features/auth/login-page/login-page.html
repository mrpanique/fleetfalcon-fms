<section class="login-shell min-h-screen px-4 py-6 sm:px-6 lg:px-8" aria-labelledby="login-heading">
  <div class="mx-auto flex min-h-[calc(100vh-3rem)] w-full max-w-6xl flex-col items-center justify-center gap-5">
    <div class="brand-hero">
      <img class="brand-hero-image" src="/ff_colorful.png" alt="FleetFalcon" />
    </div>

    <div class="login-grid w-full max-w-xl rounded-[var(--radius-xl)] border border-[var(--color-border)] bg-[var(--color-surface)]/85 p-4 shadow-2xl shadow-black/35 backdrop-blur-sm md:p-6 lg:p-8">
      <article class="rounded-[var(--radius-lg)] border border-[var(--color-border-soft)] bg-[var(--color-surface)] p-5 sm:p-7" aria-describedby="login-subtitle">
        <h1 id="login-heading" class="form-title mt-1">Sign in to FleetFalcon</h1>
        <p id="login-subtitle" class="form-subtitle mt-3">Use your company credentials.</p>

        <form class="mt-8 space-y-5" aria-label="Login form" novalidate (submit)="onSubmit($event)">
          <div class="space-y-2">
            <label for="email" class="field-label">Work email</label>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              class="field-input"
              placeholder="name@company.com"
              required
              aria-required="true"
              [disabled]="isLoading()"
            />
          </div>

          <div class="space-y-2">
            <label for="password" class="field-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              class="field-input"
              placeholder="Enter your password"
              required
              aria-required="true"
              [disabled]="isLoading()"
            />
          </div>

          <div class="flex items-center justify-between gap-3">
            <label class="inline-flex cursor-pointer items-center gap-2 text-sm text-[var(--color-text-muted)]">
              <input type="checkbox" class="checkbox-input" [disabled]="isLoading()" />
              Remember me
            </label>
            <a href="#" class="text-sm font-medium text-[var(--color-accent-2)] underline-offset-4 hover:underline focus-visible:rounded-sm">Forgot password?</a>
          </div>

          <button type="submit" class="submit-button w-full" aria-label="Sign in" [disabled]="isLoading()">
            @if (isLoading()) {
              Signing in...
            } @else {
              Sign in
            }
          </button>
        </form>
      </article>
    </div>
  </div>
</section>
