<div class="admin-actions" aria-label="Admin booking actions">
  <button type="button" class="action-btn approve-btn" (click)="approve.emit()">Approve</button>
  <button type="button" class="action-btn reject-btn" (click)="reject.emit()">Reject</button>
  <button type="button" class="action-btn cancel-btn" (click)="cancel.emit()">Cancel (own booking)</button>
  <button type="button" class="action-btn checkout-btn" (click)="checkout.emit()">Check-out</button>
  <button type="button" class="action-btn checkin-btn" (click)="checkin.emit()">Check-in</button>
</div>
