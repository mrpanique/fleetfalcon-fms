<ng-container *ngIf="items.length > 0; else emptyList">
  <ul class="booking-list" [attr.aria-label]="ariaLabel">
    <app-booking-list-item *ngFor="let item of items" [item]="item" />
  </ul>
</ng-container>

<ng-template #emptyList>
  <p class="booking-empty" role="status">No booking</p>
</ng-template>
